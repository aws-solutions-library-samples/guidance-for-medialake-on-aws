spec: v1.0.0
node:
  id: video_reframe
  title: Video Reframe (Elemental Inference)
  description: Reframe a video (or a video segment) to a vertical aspect ratio using AWS Elemental Inference smart cropping, and save the result as a derived representation of the source asset.
  version: 1.0.0
  type: utility
  integration:
    config:
      lambda:
        handler: utility/VideoReframeLambdaDeployment
        runtime: python3.12
        iam_policy:
          statements:
            - effect: Allow
              actions:
                - iam:PassRole
              resources:
                - ${MEDIACONVERT_ROLE_ARN}
            - effect: Allow
              actions:
                - mediaconvert:CreateJob
                - mediaconvert:ListJobs
                - mediaconvert:GetJob
              resources:
                - ${MEDIACONVERT_REFRAME_QUEUE_ARN}
            - effect: Allow
              actions:
                - mediaconvert:DescribeEndpoints
              resources:
                - arn:aws:mediaconvert:${AWS::Region}:${AWS::AccountId}:endpoints/*
            - effect: Allow
              actions:
                - s3:ListBucket
                - s3:GetObject
                - s3:PutObject
                - s3:DeleteObject
              resources:
                - arn:aws:s3:::${MEDIA_ASSETS_BUCKET_NAME}/*
                - arn:aws:s3:::${MEDIA_ASSETS_BUCKET_NAME}
            - effect: Allow
              actions:
                - cloudwatch:PutMetricData
              resources:
                - "*"
            - effect: Allow
              actions:
                - kms:Decrypt
              resources:
                - ${MEDIA_ASSETS_BUCKET_ARN_KMS_KEY}
            - effect: Allow
              actions:
                - kms:GenerateDataKey
              resources:
                - "*"

actions:
  reframe:
    summary: Reframe a video with Elemental Inference smart cropping
    description: Submit a MediaConvert job that uses AWS Elemental Inference smart cropping to reframe a video (or a selected segment) to the chosen vertical aspect ratio.
    operationId: reframeVideo
    parameters:
      - in: body
        name: MediaConvert Queue Arn
        required: true
        default: ${MEDIACONVERT_REFRAME_QUEUE_ARN}
        schema:
          type: string
      - in: body
        name: MediaConvert Role Arn
        required: true
        default: ${MEDIACONVERT_ROLE_ARN}
        schema:
          type: string
      - in: body
        name: Aspect Ratio
        required: false
        default: "9:16"
        description: Target output aspect ratio for the reframed video. Pick a common preset or choose Custom to enter your own width:height value. Smart cropping requires a vertical or square output (width <= height); 1:1 is the widest supported.
        schema:
          type: select
          default: "9:16"
          options:
            - label: "9:16 — Vertical (full-screen mobile video, short-form clips)"
              value: "9:16"
            - label: "4:5 — Tall portrait (social feed posts)"
              value: "4:5"
            - label: "3:4 — Portrait (tablet displays, standard portrait photo)"
              value: "3:4"
            - label: "2:3 — Classic portrait (photo prints, posters)"
              value: "2:3"
            - label: "1:1 — Square (feed tiles, thumbnails, profile media)"
              value: "1:1"
            - label: "Custom — Enter your own width:height ratio"
              value: "custom"
      - in: body
        name: Custom Aspect Ratio
        required: false
        placeholder: "e.g. 3:5"
        description: Custom width:height ratio (e.g. '3:5'). The output must be vertical or square - width must be less than or equal to height (1:1 is the widest supported).
        schema:
          type: string
        showWhen:
          field: parameters.Aspect Ratio
          value: custom
    x-requestMapping: processor/video_reframe/reframe/
    x-responseMapping: processor/video_reframe/reframe/
    connections:
      incoming:
        type: [video]
      outgoing:
        type: [any]
